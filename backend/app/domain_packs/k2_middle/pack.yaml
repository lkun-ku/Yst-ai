# 领域包 · 科目二·中学《教育知识与能力》
#
# 保留本包的目的只有一个：**证明「模块 / 权重 / 题型是数据，加科目不改这些逻辑」成立**。
# 身份元数据（科目序号 2 / 名称 / 学段 / 代码 302）不在此声明，见 k1 的说明。
# 官方口径出处：docs/用户需求文档.md §1.2（八模块）。

key: k2_middle

version: "2026-09"

# 官方八模块（§1.2）。
#
# ⚠️ 已知边界一：`Module` 枚举目前是**科目一专属**（职业理念 / 职业道德 / 教育法律法规 /
#    文化素养 / 基本能力）。科目二的模块尚未进入该枚举，因此这里只声明 `name`、不带 `enum`。
#    理由：`Module` 同时驱动「五维掌握度雷达」与组卷权重，直接并入会污染科目一的统计口径。
#    后果：`module_weights(k2_middle)` 会**明确报错**，而不是静默返回空列表。
#    处置与触发条件见 docs/adr/0012-domain-pack结构.md。
#
# ⚠️ 已知边界二：官方**未公布**科目二各模块的分值权重（§1.2 只给模块名），
#    因此本包**不声明 weight** —— 不猜、也不用 1/8 平均值兜底。
#    loader 的权重求和校验（不变量 4）只作用于声明了完整权重的包，本包自动跳过。
modules:
  - name: 教育基础知识和基本原理
  - name: 中学课程
  - name: 中学教学
  - name: 中学生学习心理
  - name: 中学生发展心理
  - name: 中学生心理辅导
  - name: 中学德育
  - name: 中学班级管理与教师心理

# 本仓只实现这四类（QuestionType 成员名）：
# 单选用于维持现有客观题闭环；其余三类供科目二主观题（材料分析 / 教学设计等）。
# 注：科目二主观题**批改**属本期范围之外，此处仅声明题型，不代表已实现批改。
question_types:
  - SINGLE
  - SHORT
  - MATERIAL
  - DESIGN
