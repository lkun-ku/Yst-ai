# 领域包 · 科目一《综合素质》
#
# 本文件**只声明「内容」**：模块与权重、题型、考纲版本。
# 「身份」元数据（科目序号 / 官方名称 / 覆盖学段 / 试卷代码）的权威在
# `app/models.py` 的 `SUBJECT_META` 与 `PAPER_CODES` —— 此处**不重复声明**：
# 两处都写就会出现「改了其中一份、没有任何报错」的漂移。
#
# 约定与四条不变量见 ../README.md；校验在 loader.py（不满足即报错，不做「尽量修正」）。
# 官方口径出处：docs/用户需求文档.md §1.1（科目与代码）、§1.3（五大模块权重）、§1.5（题型）。

key: k1_comprehensive   # 必须等于目录名，且必须是 models.Subject 的枚举值

# 考纲版本。变更（考纲修订 / 模块调整）时必须同步三处：
# knowledge_tree 种子、syllabus/ 语料，以及预计算闭包携带的本体版本号。
version: "2026-06"

# 官方五大模块与权重（§1.3）。
# 权重为**占比小数**（非百分数），五者之和必须为 1.0（loader 不变量 4）。
modules:
  - enum: PROFESSIONAL_IDEA
    name: 职业理念
    weight: 0.15
  - enum: PROFESSIONAL_ETHICS
    name: 教师职业道德规范
    weight: 0.15
  - enum: EDU_LAW
    name: 教育法律法规
    weight: 0.10
  - enum: CULTURE_LITERACY
    name: 文化素养
    weight: 0.12
  - enum: BASIC_ABILITY
    name: 基本能力
    weight: 0.48

# 官方题型（§1.5）中本包实际使用的部分（QuestionType 成员名）。
# 科目一分值结构（§1.4）：单选 58 分 (39%) · 材料分析 42 分 (28%) · 写作 50 分 (33%)
# —— 主观题合计 92 分 = 61% 卷面，这是本产品的主战场。
question_types:
  - SINGLE    # 单项选择题 58 分
  - MATERIAL  # 材料（案例）分析 42 分
  - WRITING   # 写作 50 分
